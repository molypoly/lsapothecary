<!-- booking.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <title>Booking | L & S Apothecary</title>
  </head>
  <body>
    <!-- Hidden form for Netlify's build-time form detection -->
    <form name="booking-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="preferred-datetime" />
      <textarea name="notes"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="app"></div>
    <script type="module" src="/src/booking.js"></script>
  </body>
</html>
